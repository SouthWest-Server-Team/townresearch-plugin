# ============================================
# 多研究院加速
# 同一科技被多个研究院同时研究时，研究速率随研究院数量增大
# 封顶 5 个研究院
# lab-speed-max-multiplier: 5个研究院时的最大速率倍率
# ============================================
lab-speed:
  max-multiplier: 5.0

# ============================================
# 付费加速
# 玩家可通过花费城邦银行金币购买加速等级
# 每级需逐级购买，到达最大值后不可继续购买
# ============================================
